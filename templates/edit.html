<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient</title>
</head>
<body>
    <h1>Edit Patient</h1>
    {% if message %}
        <p>{{ message }}</p>
    {% endif %}
    <form method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ patient['name'] }}" required><br>

        <label for="mobile">Mobile:</label>
        <input type="text" id="mobile" name="mobile" value="{{ patient['mobile'] }}" required><br>

        <label for="sex">Sex:</label>
        <select id="sex" name="sex" required>
            <option value="Male" {% if patient['sex'] == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if patient['sex'] == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if patient['sex'] == 'Other' %}selected{% endif %}>Other</option>
        </select><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" value="{{ patient['age'] }}" required><br>

        <button type="submit">Update</button>
    </form>
    <a href="{{ url_for('index') }}">Back to Home</a>
</body>
</html>
